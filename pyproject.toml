[project]
name = "skill-launcher"
version = "0.2.0"
description = "Local launcher/manager for Claude Skills (SKILL.md)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9,<4", "pyyaml>=6,<7"]

[project.scripts]
skill-launcher = "skill_launcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skill_launcher"]

[tool.setuptools.package-data]
skill_launcher = ["static/*"]


[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

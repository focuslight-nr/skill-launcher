<!doctype html>
<html lang="ja" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-launcher</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-bottom: 4rem; background: #f6f7f9; }
  .skill-card { transition: box-shadow .15s ease; }
  .skill-card:hover { box-shadow: 0 .25rem .75rem rgba(0,0,0,.08); }
  .skill-icon { font-size: 1.6rem; line-height: 1; }
  .category-heading { position: sticky; top: 56px; background: #f6f7f9; z-index: 5; padding: .5rem 0; }
  .badge-source { font-weight: 400; }
  #exportBar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #dee2e6; z-index: 20; }
  .source-row { display: flex; align-items: center; gap: .5rem; }
  .form-switch .form-check-input { width: 2.5em; }
  pre.file-preview { white-space: pre-wrap; font-size: .8rem; max-height: 24rem; overflow: auto; background: #f1f3f5; padding: .5rem; border-radius: .25rem; }
  .issue-dot { cursor: help; }
  .token-pill { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid gap-3 flex-wrap justify-content-start">
    <span class="navbar-brand mb-0 h1 me-2">&#129504; skill-launcher</span>

    <div class="d-flex align-items-center gap-2 flex-wrap flex-grow-1">
      <label class="small text-muted mb-0" data-i18n="nav.target"></label>
      <select class="form-select form-select-sm w-auto" style="min-width:230px;max-width:340px" id="targetSelect"></select>
      <button class="btn btn-sm btn-outline-secondary" id="manageTargetsBtn" data-i18n-title="nav.manageTargets">…</button>

      <label class="small text-muted mb-0 ms-2" data-i18n="nav.profile"></label>
      <select class="form-select form-select-sm w-auto" style="min-width:180px;max-width:320px" id="profileSelect">
        <option value="" data-i18n="nav.profile.pick"></option>
      </select>
      <button class="btn btn-sm btn-primary" id="applyProfileBtn" data-i18n="nav.apply"></button>
      <button class="btn btn-sm btn-outline-secondary" id="saveProfileBtn" data-i18n="nav.saveCurrent" data-i18n-title="nav.saveCurrent.title"></button>
      <button class="btn btn-sm btn-outline-danger" id="deleteProfileBtn" data-i18n="nav.delete"></button>

      <select class="form-select form-select-sm w-auto ms-2" id="langSelect" style="min-width:5.5rem">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>
</nav>

<div class="bg-white border-bottom">
  <div class="container-fluid py-2 d-flex flex-wrap align-items-center gap-3 small">
    <span id="statsLine" class="text-muted"></span>
    <span class="token-pill badge bg-dark-subtle text-dark-emphasis" id="tokenPill" data-i18n-title="bar.tokens.title"></span>
    <button class="btn btn-sm btn-outline-warning py-0 d-none" id="doctorBtn">診断結果あり</button>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary py-0" id="newSkillBtn" data-i18n="bar.newSkill"></button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="iconsBtn" data-i18n="bar.icons"></button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="doctorOpenBtn" data-i18n="bar.doctor"></button>
    </div>
  </div>
</div>

<div class="container-fluid py-3">

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span data-i18n="sources.title"></span>
      <button class="btn btn-sm btn-outline-secondary" id="rescanBtn" data-i18n="sources.rescan"></button>
    </div>
    <div class="card-body">
      <div id="sourceList" class="mb-3"></div>
      <form id="addSourceForm" class="row g-2">
        <div class="col-sm-6">
          <input type="text" class="form-control form-control-sm" id="sourcePath" data-i18n-placeholder="sources.path.placeholder">
        </div>
        <div class="col-sm-3">
          <input type="text" class="form-control form-control-sm" id="sourceLabel" data-i18n-placeholder="sources.label.placeholder">
        </div>
        <div class="col-sm-3">
          <button type="submit" class="btn btn-sm btn-primary w-100" data-i18n="sources.add"></button>
        </div>
      </form>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <input type="search" class="form-control" style="max-width:320px" id="searchBox" data-i18n-placeholder="filter.search">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="fullTextFilter">
      <label class="form-check-label small" for="fullTextFilter" data-i18n="filter.fullText"></label>
    </div>
    <select class="form-select" style="max-width:200px" id="categoryFilter"></select>
    <select class="form-select" style="max-width:200px" id="sourceFilter"></select>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="issuesOnlyFilter">
      <label class="form-check-label small" for="issuesOnlyFilter" data-i18n="filter.issuesOnly"></label>
    </div>
    <div class="form-check form-switch ms-auto">
      <input class="form-check-input" type="checkbox" id="enabledOnlyFilter">
      <label class="form-check-label" for="enabledOnlyFilter" data-i18n="filter.enabledOnly"></label>
    </div>
  </div>

  <div id="skillContainer"></div>
  <div id="emptyState" class="text-center text-muted py-5 d-none" data-i18n="empty.state"></div>
</div>

<div id="exportBar" class="p-2 d-none">
  <div class="container-fluid d-flex align-items-center gap-3">
    <span><span id="selectedCount"></span> <span class="text-muted" id="selectedTokens"></span></span>
    <button class="btn btn-success btn-sm" id="exportBtn" data-i18n="export.run"></button>
    <button class="btn btn-outline-primary btn-sm" id="profileFromSelectionBtn" data-i18n="export.toProfile"></button>
    <button class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn" data-i18n="export.clear"></button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="edit.title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2 text-muted small" id="editPath"></div>
        <div id="editIssues" class="mb-2"></div>
        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabEdit" type="button" data-i18n="edit.tab.skill"></button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabFiles" type="button"><span data-i18n="edit.tab.files"></span> <span class="badge bg-secondary" id="fileCount">0</span></button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tabEdit">
            <div class="mb-3">
              <label class="form-label" data-i18n="edit.name"></label>
              <input type="text" class="form-control" id="editName">
            </div>
            <div class="mb-3">
              <label class="form-label d-flex justify-content-between">
                <span data-i18n="edit.description"></span>
                <span class="text-muted small" id="descCounter"></span>
              </label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="edit.body"></label>
              <textarea class="form-control font-monospace" id="editBody" rows="16"></textarea>
            </div>
          </div>
          <div class="tab-pane fade" id="tabFiles">
            <div class="row">
              <div class="col-md-4">
                <div class="list-group list-group-flush" id="fileList"></div>
              </div>
              <div class="col-md-8">
                <pre class="file-preview" id="filePreview" data-i18n="edit.filePlaceholder"></pre>
              </div>
            </div>
          </div>
        </div>
        <div class="alert alert-info small mt-2" id="editSavedMsg" style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary me-auto" id="duplicateBtn" data-i18n="edit.duplicate"></button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="edit.close"></button>
        <button type="button" class="btn btn-primary" id="saveEditBtn" data-i18n="edit.save"></button>
      </div>
    </div>
  </div>
</div>

<!-- New skill modal -->
<div class="modal fade" id="newSkillModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="new.title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" data-i18n="new.source"></label>
          <select class="form-select" id="newSkillSource"></select>
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="new.category"></label>
          <input type="text" class="form-control" id="newSkillCategory" placeholder="dev">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="edit.name"></label>
          <input type="text" class="form-control" id="newSkillName" placeholder="my-skill">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="edit.description"></label>
          <textarea class="form-control" id="newSkillDescription" rows="3" data-i18n-placeholder="new.description.placeholder"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="edit.close"></button>
        <button type="button" class="btn btn-primary" id="createSkillBtn" data-i18n="new.create"></button>
      </div>
    </div>
  </div>
</div>

<!-- Targets modal -->
<div class="modal fade" id="targetsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="targets.title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted" data-i18n-html="targets.help"></p>
        <div id="targetList" class="mb-3"></div>
        <form id="addTargetForm" class="row g-2">
          <div class="col-sm-6"><input type="text" class="form-control form-control-sm" id="targetPath" data-i18n-placeholder="targets.path.placeholder"></div>
          <div class="col-sm-3"><input type="text" class="form-control form-control-sm" id="targetLabel" data-i18n-placeholder="targets.label.placeholder"></div>
          <div class="col-sm-3"><button class="btn btn-sm btn-primary w-100" type="submit" data-i18n="targets.add"></button></div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Doctor modal -->
<div class="modal fade" id="doctorModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="doctor.title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><div id="doctorList"></div></div>
    </div>
  </div>
</div>

<!-- Icons modal -->
<div class="modal fade" id="iconsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="icons.title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted" data-i18n-html="icons.help"></p>
        <div id="iconRows"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="edit.close"></button>
        <button type="button" class="btn btn-primary" id="saveIconsBtn" data-i18n="icons.save"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

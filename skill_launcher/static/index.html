<!doctype html>
<html lang="ja" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-launcher</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-bottom: 4rem; background: #f6f7f9; }
  .skill-card { transition: box-shadow .15s ease; }
  .skill-card:hover { box-shadow: 0 .25rem .75rem rgba(0,0,0,.08); }
  .skill-icon { font-size: 1.6rem; line-height: 1; }
  .category-heading { position: sticky; top: 56px; background: #f6f7f9; z-index: 5; padding: .5rem 0; }
  .badge-source { font-weight: 400; }
  #exportBar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #dee2e6; z-index: 20; }
  .source-row { display: flex; align-items: center; gap: .5rem; }
  .form-switch .form-check-input { width: 2.5em; }
  pre.file-preview { white-space: pre-wrap; font-size: .8rem; max-height: 24rem; overflow: auto; background: #f1f3f5; padding: .5rem; border-radius: .25rem; }
  .issue-dot { cursor: help; }
  .token-pill { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid gap-3 flex-wrap justify-content-start">
    <span class="navbar-brand mb-0 h1 me-2">&#129504; skill-launcher</span>

    <div class="d-flex align-items-center gap-2 flex-wrap flex-grow-1">
      <label class="small text-muted mb-0">有効化先</label>
      <select class="form-select form-select-sm w-auto" style="min-width:230px;max-width:340px" id="targetSelect"></select>
      <button class="btn btn-sm btn-outline-secondary" id="manageTargetsBtn" title="有効化先を追加・削除">…</button>

      <label class="small text-muted mb-0 ms-2">プロファイル</label>
      <select class="form-select form-select-sm w-auto" style="min-width:180px;max-width:320px" id="profileSelect">
        <option value="">（選択）</option>
      </select>
      <button class="btn btn-sm btn-primary" id="applyProfileBtn">適用</button>
      <button class="btn btn-sm btn-outline-secondary" id="saveProfileBtn" title="現在の有効化状態をプロファイルとして保存">現状を保存</button>
      <button class="btn btn-sm btn-outline-danger" id="deleteProfileBtn">削除</button>
    </div>
  </div>
</nav>

<div class="bg-white border-bottom">
  <div class="container-fluid py-2 d-flex flex-wrap align-items-center gap-3 small">
    <span id="statsLine" class="text-muted"></span>
    <span class="token-pill badge bg-dark-subtle text-dark-emphasis" id="tokenPill" title="有効化中スキルの name + description は常にコンテキストに載ります（概算）"></span>
    <button class="btn btn-sm btn-outline-warning py-0 d-none" id="doctorBtn">診断結果あり</button>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary py-0" id="newSkillBtn">＋ 新規スキル</button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="iconsBtn">アイコン設定</button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="doctorOpenBtn">診断</button>
    </div>
  </div>
</div>

<div class="container-fluid py-3">

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>スキルソース</span>
      <button class="btn btn-sm btn-outline-secondary" id="rescanBtn">再スキャン</button>
    </div>
    <div class="card-body">
      <div id="sourceList" class="mb-3"></div>
      <form id="addSourceForm" class="row g-2">
        <div class="col-sm-6">
          <input type="text" class="form-control form-control-sm" id="sourcePath" placeholder="~/repos/my-skills/skills など、絶対パスか ~ 展開可">
        </div>
        <div class="col-sm-3">
          <input type="text" class="form-control form-control-sm" id="sourceLabel" placeholder="ラベル（省略可）">
        </div>
        <div class="col-sm-3">
          <button type="submit" class="btn btn-sm btn-primary w-100">ソースを追加</button>
        </div>
      </form>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <input type="search" class="form-control" style="max-width:320px" id="searchBox" placeholder="名前・説明で検索...">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="fullTextFilter">
      <label class="form-check-label small" for="fullTextFilter">本文も検索</label>
    </div>
    <select class="form-select" style="max-width:200px" id="categoryFilter">
      <option value="">すべてのカテゴリ</option>
    </select>
    <select class="form-select" style="max-width:200px" id="sourceFilter">
      <option value="">すべてのソース</option>
    </select>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="issuesOnlyFilter">
      <label class="form-check-label small" for="issuesOnlyFilter">要確認のみ</label>
    </div>
    <div class="form-check form-switch ms-auto">
      <input class="form-check-input" type="checkbox" id="enabledOnlyFilter">
      <label class="form-check-label" for="enabledOnlyFilter">有効化済みのみ</label>
    </div>
  </div>

  <div id="skillContainer"></div>
  <div id="emptyState" class="text-center text-muted py-5 d-none">
    スキルが見つかりません。上でソースを追加してください。
  </div>
</div>

<div id="exportBar" class="p-2 d-none">
  <div class="container-fluid d-flex align-items-center gap-3">
    <span><strong id="selectedCount">0</strong> 件選択中 <span class="text-muted" id="selectedTokens"></span></span>
    <button class="btn btn-success btn-sm" id="exportBtn">選択したスキルをエクスポート</button>
    <button class="btn btn-outline-primary btn-sm" id="profileFromSelectionBtn">選択からプロファイル作成</button>
    <button class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn">選択解除</button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">スキルを編集</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2 text-muted small" id="editPath"></div>
        <div id="editIssues" class="mb-2"></div>
        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabEdit" type="button">SKILL.md</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabFiles" type="button">同梱ファイル <span class="badge bg-secondary" id="fileCount">0</span></button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tabEdit">
            <div class="mb-3">
              <label class="form-label">name</label>
              <input type="text" class="form-control" id="editName">
            </div>
            <div class="mb-3">
              <label class="form-label d-flex justify-content-between">
                <span>description</span>
                <span class="text-muted small" id="descCounter"></span>
              </label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">本文（Markdown）</label>
              <textarea class="form-control font-monospace" id="editBody" rows="16"></textarea>
            </div>
          </div>
          <div class="tab-pane fade" id="tabFiles">
            <div class="row">
              <div class="col-md-4">
                <div class="list-group list-group-flush" id="fileList"></div>
              </div>
              <div class="col-md-8">
                <pre class="file-preview" id="filePreview">左のファイルを選択すると内容を表示します。</pre>
              </div>
            </div>
          </div>
        </div>
        <div class="alert alert-info small mt-2" id="editSavedMsg" style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary me-auto" id="duplicateBtn">複製</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
        <button type="button" class="btn btn-primary" id="saveEditBtn">保存（自動バックアップ）</button>
      </div>
    </div>
  </div>
</div>

<!-- New skill modal -->
<div class="modal fade" id="newSkillModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新規スキルを作成</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">作成先ソース</label>
          <select class="form-select" id="newSkillSource"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">カテゴリ（フォルダ。空なら直下）</label>
          <input type="text" class="form-control" id="newSkillCategory" placeholder="dev">
        </div>
        <div class="mb-3">
          <label class="form-label">name</label>
          <input type="text" class="form-control" id="newSkillName" placeholder="my-skill">
        </div>
        <div class="mb-3">
          <label class="form-label">description</label>
          <textarea class="form-control" id="newSkillDescription" rows="3" placeholder="何をするスキルか＋いつ使うか"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
        <button type="button" class="btn btn-primary" id="createSkillBtn">作成</button>
      </div>
    </div>
  </div>
</div>

<!-- Targets modal -->
<div class="modal fade" id="targetsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">有効化先（ターゲット）</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted">
          ユーザーグローバル（<code>~/.claude/skills</code>）に加えて、プロジェクトごとの
          <code>&lt;project&gt;/.claude/skills</code> を有効化先として登録できます。プロジェクトのルートを入力すれば
          <code>.claude/skills</code> を補完します。
        </p>
        <div id="targetList" class="mb-3"></div>
        <form id="addTargetForm" class="row g-2">
          <div class="col-sm-6"><input type="text" class="form-control form-control-sm" id="targetPath" placeholder="~/repos/my-project"></div>
          <div class="col-sm-3"><input type="text" class="form-control form-control-sm" id="targetLabel" placeholder="ラベル（省略可）"></div>
          <div class="col-sm-3"><button class="btn btn-sm btn-primary w-100" type="submit">追加</button></div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Doctor modal -->
<div class="modal fade" id="doctorModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">診断</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><div id="doctorList"></div></div>
    </div>
  </div>
</div>

<!-- Icons modal -->
<div class="modal fade" id="iconsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">カテゴリのアイコン</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted">カテゴリ名 → 絵文字。空欄にすると既定に戻ります（SKILL.md の <code>icon:</code> が最優先）。</p>
        <div id="iconRows"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
        <button type="button" class="btn btn-primary" id="saveIconsBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
